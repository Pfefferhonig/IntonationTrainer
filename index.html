<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Train your ear to sing in tune in a choir.">
  <title>Choir Intonation Trainer</title>
  <!-- Icon: Lucide "audio-waveform" (ISC license, see docs/CREDITS.md) -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-4 -4 32 32'%3E%3Crect x='-4' y='-4' width='32' height='32' rx='8' fill='%232c5f8d'/%3E%3Cpath d='M2 13a2 2 0 0 0 2-2V7a2 2 0 0 1 4 0v13a2 2 0 0 0 4 0V4a2 2 0 0 1 4 0v13a2 2 0 0 0 4 0v-4a2 2 0 0 1 2-2' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/listening.css">
  <link rel="stylesheet" href="css/producing.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#app">Skip to exercise</a>
  <header class="app-header" data-inset-top>
    <div class="container brand-row">
      <a class="brand" href="#/">
        <span class="brand-mark" aria-hidden="true">
          <!-- Lucide "audio-waveform", ISC license -->
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="M2 13a2 2 0 0 0 2-2V7a2 2 0 0 1 4 0v13a2 2 0 0 0 4 0V4a2 2 0 0 1 4 0v13a2 2 0 0 0 4 0v-4a2 2 0 0 1 2-2"/></svg>
        </span>
        <span class="brand-text">Choir Intonation Trainer</span>
      </a>
    </div>
    <nav id="tabbar" class="tabbar" aria-label="Exercises"></nav>
  </header>

  <main id="app" class="container" tabindex="-1">
    <p class="boot-msg" id="boot-msg">Loading&hellip;</p>
  </main>

  <script>
    // Plain (non-module) script: explains what to do if the app itself fails to start.
    (function () {
      var msg = document.getElementById('boot-msg');
      function explain(text) {
        if (msg && !document.documentElement.hasAttribute('data-booted')) {
          msg.className = 'boot-msg boot-error';
          msg.textContent = text;
        }
      }
      if (location.protocol === 'file:') {
        explain('This app cannot be opened by double-clicking index.html. Please double-click start.bat instead - it opens the app in your browser.');
      } else {
        setTimeout(function () {
          explain('The app didn’t start. Reload the page. If that doesn’t help, use an up-to-date Chrome, Edge, Firefox or Safari.');
        }, 5000);
      }
    })();
  </script>
</body>
</html>
